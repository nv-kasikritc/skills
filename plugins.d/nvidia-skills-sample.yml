# Sample catalog definition for a portable Agent Plugins 1.0.0 package.
# Rebuild with .github/scripts/build-plugins.sh; generated manifests belong
# under plugins/nvidia-skills-sample/, not in this source definition.
name: nvidia-skills-sample
version: "0.1.0"
description: Sample Agent Plugins package that helps users discover the right NVIDIA skill for their workflow.

display_name: NVIDIA Skills Sample
short_description: Discover NVIDIA skills with a portable sample plugin
long_description: A sample Agent Plugins 1.0.0 package bundling NVIDIA Skill Finder. Ask about an NVIDIA workflow to get a matching skill, an install command, and a first prompt.
category: Developer Tools

# Attribute this sample's packaging separately from the bundled NVIDIA skill.
author:
  name: nv-kasikritc
  url: https://github.com/nv-kasikritc
homepage: https://github.com/nv-kasikritc/skills
repository: https://github.com/nv-kasikritc/skills
license: Apache-2.0 AND CC-BY-4.0

keywords:
  - nvidia
  - agent-plugins
  - sample
  - skill-discovery

default_prompts:
  - "Which NVIDIA skills can help with simulation and robotics?"
  - "Find an NVIDIA skill for GPU-accelerated data processing."

# Real files keep the package self-contained when copied outside this repo.
# Symlinks back into the top-level catalog would escape the plugin root.
skill_files: copy
include_skills:
  - skills/nvidia-skill-finder/

# This is an example for local use, not an official marketplace listing.
marketplace_enabled:
  claude: false
  codex: false
  cursor: false
